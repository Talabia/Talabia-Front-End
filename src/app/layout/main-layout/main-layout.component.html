<div class="layout-container">
    <!-- Header -->
    <app-header (toggleHideSidebar)="toggleHideSidebar()"></app-header>
    <!-- Sidebar + Main Content -->
    <div class="layout-body">
        <app-side-bar [hidden]="hidden()"></app-side-bar>
        @if (showBackdrop()) {
            <div class="sidebar-backdrop" (click)="closeMobileSidebar()"></div>
        }
        <main class="layout-content">
            <router-outlet />
        </main>
    </div>
</div>

<!-- App-wide toasts (e.g. permission errors from the auth interceptor) -->
<p-toast [key]="globalToastKey"></p-toast>

<!-- Global Loader -->
<app-global-loader />
