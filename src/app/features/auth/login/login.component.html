<div class="login-container">
  <p-toast></p-toast>
  <p-card>
    <div class="login-card">
      <div class="login-header">
        <!-- Placeholder for Logo if needed -->
        <!-- <img src="assets/images/logo.png" alt="Logo" class="login-logo"> -->
        <div class="login-title">{{ 'auth.login.title' | translate }}</div>
        <div class="login-subtitle">{{ 'auth.login.subtitle' | translate }}</div>
      </div>

      <div class="login-form">
        <app-phone-input name="phone" [(ngModel)]="emailOrPhone" #phoneField="ngModel"
          (ngModelChange)="authError.set(null)" [label]="'auth.login.label' | translate"
          defaultCountry="SA" [lockCountry]="true" [maxDigits]="9" allowedFirstDigits="5"
          [class.phone-input-invalid]="phoneField.dirty && phoneField.hasError('invalidPrefix')"></app-phone-input>
        @if (phoneField.dirty && phoneField.hasError('invalidPrefix')) {
          <small class="p-error" role="alert">{{ 'auth.validation.mustStartWith5' | translate }}</small>
        }
        @if (authError()) {
          <div class="login-auth-error" role="alert">{{ authError() }}</div>
        }
        <p-button (click)="onSendOtp()" [label]="'auth.login.button' | translate" icon="pi pi-arrow-right"
          iconPos="right" [loading]="loading" class="login-submit-btn"></p-button>
      </div>
    </div>
  </p-card>
</div>
