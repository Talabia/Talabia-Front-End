<div class="login-container">
  <p-toast></p-toast>
  <p-card>
    <div class="login-card">
      <div class="login-header">
        <!-- Placeholder for Logo if needed -->
        <!-- <img src="assets/images/logo.png" alt="Logo" class="login-logo"> -->
        <div class="login-title">{{ 'auth.login.title' | translate }}</div>
        <div class="login-subtitle">{{ 'auth.login.subtitle' | translate }}</div>
      </div>

      <div class="login-form">
        <app-phone-input name="phone" [(ngModel)]="emailOrPhone" #phoneField="ngModel"
          [label]="'auth.login.label' | translate" defaultCountry="SA" [lockCountry]="true"></app-phone-input>
        @if (phoneField.invalid && phoneField.touched) {
          <small class="p-error">{{ 'auth.validation.invalidPhone' | translate }}</small>
        }
        <p-button (click)="onSendOtp()" [label]="'auth.login.button' | translate" icon="pi pi-arrow-right"
          iconPos="right" [loading]="loading" class="login-submit-btn"></p-button>
      </div>
    </div>
  </p-card>
</div>
