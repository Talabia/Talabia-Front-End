<p-card>
    <div class="card">
        <!-- Loading State -->
        @if (loading) {
        <div class="loading-container">
            <i class="pi pi-spin pi-spinner loading-icon"></i>
            <p class="loading-text">{{ 'usagePolicy.loading' | translate }}</p>
        </div>
        }

        <!-- Error State -->
        @if (!loading && errorMessage) {
        <div class="error-container">
            <p-message severity="error" size="small">
                {{errorMessage}}
            </p-message>
            <p-button [label]="'common.retry' | translate" icon="pi pi-refresh" severity="secondary"
                (click)="retry()" />
        </div>
        }

        <!-- Content Display -->
        @if (!loading && !errorMessage && htmlContent) {
        <div class="content-display" [innerHTML]="htmlContent"></div>
        }
    </div>
</p-card>

<p-toast />
